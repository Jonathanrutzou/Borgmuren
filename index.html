<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Borgmuren</title>
<style>
  :root { --bg: #1f2328; --fg: #eee; --btn: #333; --border: #555; --accent: #4ade80; --board: #e7e2d4; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; align-items: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  #hud, #tools { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: center; padding: 6px 8px; }
  #tools { gap: 6px; padding-top: 0; }
  #hud .stat { font-size: 15px; }
  button { font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 2px solid var(--border); background: var(--btn); color: var(--fg); cursor: pointer; }
  button small { opacity: 0.7; }
  button.active { border-color: var(--accent); background: #234; }
  button:disabled { opacity: 0.4; cursor: default; }
  #bStart { border-color: var(--accent); }
  .info { font-size: 14px; font-weight: bold; }
  #msg { font-size: 14px; color: #fbbf24; min-height: 18px; text-align: center; padding: 0 8px; }
  #wrap { position: relative; margin-top: 4px; }
  canvas { display: block; background: var(--board); }
  #overlay { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); font-size: 28px; gap: 16px; }
  #overlay button { font-size: 20px; padding: 10px 20px; }
</style>
</head>
<body>
  <div id="hud">
    <span class="stat" id="sWave"></span>
    <span class="stat" id="sCastle"></span>
    <span class="stat" id="sGold"></span>
    <span class="stat" id="sHero"></span>
    <button id="bZoomOut" aria-label="Zoom ud">−</button>
    <button id="bZoomIn" aria-label="Zoom ind">+</button>
    <button id="bStart">Start bølge</button>
  </div>
  <div id="tools"></div>
  <div id="msg"></div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="overlay"><div id="overlayText"></div><button id="bRestart">Spil igen</button></div>
  </div>
  <script src="game.js"></script>
</body>
</html>

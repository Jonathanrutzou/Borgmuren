<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Borgmuren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #1f2328; --fg: #eee; --btn: #2b3036; --bar: rgba(31,35,40,0.82); --border: #555; --accent: #4ade80; --warn: #fbbf24; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; overflow: hidden; }
  /* På højkant drejes spillet, så det altid vises i landskab (størrelsen sættes i resize()). */
  html.portrait #app { inset: auto; top: 0; left: 0; transform-origin: top left; transform: rotate(90deg) translateY(-100%); }
  html.portrait .bar { padding-left: max(16px, env(safe-area-inset-top, 0px)); padding-right: max(16px, env(safe-area-inset-bottom, 0px)); }
  html.portrait #hud { padding-top: 6px; }
  html.portrait #tools { padding-bottom: 8px; }
  html.portrait #msg { top: 56px; }
  canvas { display: block; position: absolute; inset: 0; }
  .bar { position: absolute; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: center;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         background: var(--bar); }
  #hud { top: 0; padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: 6px; }
  #tools { bottom: 0; gap: 6px; padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
           transform: translateY(105%); transition: transform 0.45s cubic-bezier(0.65, 0, 0.35, 1); }
  #tools.shown { transform: none; }
  #tools.enter > * { animation: rise 0.45s cubic-bezier(0.65, 0, 0.35, 1) both; }
  #tools.enter > :nth-child(2) { animation-delay: 0.03s; } #tools.enter > :nth-child(3) { animation-delay: 0.06s; }
  #tools.enter > :nth-child(4) { animation-delay: 0.09s; } #tools.enter > :nth-child(5) { animation-delay: 0.12s; }
  #tools.enter > :nth-child(6) { animation-delay: 0.15s; } #tools.enter > :nth-child(7) { animation-delay: 0.18s; }
  #tools.enter > :nth-child(8) { animation-delay: 0.21s; } #tools.enter > :nth-child(n+9) { animation-delay: 0.24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { #tools, #menu, #game, #menuBg, #menuFg { transition: none; } #tools.enter > * { animation: none; } }
  #hud .stat { font-size: 15px; font-variant-numeric: tabular-nums; }
  button { font-size: 14px; padding: 7px 11px; border-radius: 6px; border: 2px solid var(--border); background: var(--btn); color: var(--fg); cursor: pointer;
           transition: background 0.25s, border-color 0.25s; }
  button small { opacity: 0.7; }
  button.active { border-color: var(--accent); background: #234; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #bStart { border-color: var(--accent); }
  .info { font-size: 14px; font-weight: bold; }
  #nextWave { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px));
              font-size: 14px; background: var(--bar); padding: 5px 10px; border-radius: 6px; display: flex; flex-wrap: wrap; gap: 4px 12px; pointer-events: none; }
  #nextWave .mon b { font-size: 16px; }
  #msg { position: absolute; top: calc(56px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
         max-width: calc(100% - 32px); font-size: 14px; color: var(--warn); background: var(--bar); padding: 4px 10px; border-radius: 6px; text-align: center; pointer-events: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); font-size: 28px; gap: 16px; text-align: center; padding: 16px; }
  #overlay button { font-size: 20px; padding: 10px 20px; }
  #overlay .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* Menuer: start, baneoversigt og spillet ligger under hinanden og rulles med parallakse. */
  /* Menuer: start, baneoversigt og spillet ligger under hinanden og rulles med parallakse.
     Afdæmpede farver: pergament, skifergrå og sand. */
  :root { --paper: #ebe6dc; --paper2: #ddd5c6; --ink: #36454b; --soft: #8c8273; --faint: #c8bfae; --board: #e7e2d4; }
  #menu, #game { position: absolute; inset: 0; transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1); }
  #game { background: var(--board); }
  #menu { overflow: hidden; background: var(--paper); font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; font-variant-numeric: lining-nums; }
  #menuBg, #menuFg { position: absolute; left: 0; right: 0; top: 0; height: 200%; transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1); }
  #menuBg { background: linear-gradient(var(--paper) 0%, var(--paper) 45%, var(--paper2) 100%); }
  .bgline { position: absolute; left: 0; right: 0; height: 1px; background: var(--faint); opacity: 0.6; }
  #menuFg .screen { position: relative; height: 50%; display: flex; flex-direction: column; color: var(--ink); }
  #scrStart { align-items: center; justify-content: center; cursor: pointer; }
  #scrStart .big { font-size: 88px; font-weight: 500; letter-spacing: 18px; padding-left: 18px; color: var(--ink); }
  .half { flex: 1 1 50%; min-height: 0; display: flex; flex-direction: column; padding: 16px max(24px, env(safe-area-inset-left, 0px)) 8px; }
  .half.bottom { border-top: 1px solid var(--faint); }
  .half h2 { margin: 0 0 8px; font-size: 26px; font-weight: 500; letter-spacing: 2px; display: flex; gap: 16px; align-items: baseline; }
  .half h2 small { font-size: 18px; color: var(--soft); }
  #levels { flex: 1; display: flex; overflow: hidden; align-items: center; touch-action: none; cursor: grab; }
  .lvl { flex: 0 0 20%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .lvl .num { width: min(56%, 92px); aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center;
              font-size: 34px; font-weight: 600; color: var(--ink); }
  .lvl .stars { font-size: 20px; letter-spacing: 3px; font-family: system-ui, sans-serif; }
  .lvl .stars .on { color: var(--ink); }
  .lvl .stars .off { color: var(--faint); }
  .lvl.locked .num { border-color: var(--faint); color: var(--faint); }
  .lvl.playing .num { box-shadow: 0 0 0 5px var(--paper), 0 0 0 7px #a3563f; }
  #shop { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); grid-auto-rows: min-content; gap: 10px; align-content: start; overflow: hidden; }
  #shop button, #levelDialog button { font-family: inherit; font-size: 19px; background: transparent; color: var(--ink); border: 1px solid var(--ink); border-radius: 4px; text-align: left; padding: 10px 12px; }
  #shop button small { display: block; color: var(--soft); font-size: 16px; }
  #shop button.owned { background: var(--ink); color: var(--paper); }
  #shop button.owned small { color: var(--faint); }
  #levelDialog { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(54,69,75,0.35); }
  #levelDialog .box { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center; font-size: 24px; }
  #levelDialog .box .row { display: flex; gap: 12px; }
  #menuMsg { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 6px 14px; border-radius: 4px; font-size: 18px; pointer-events: none; }
</style>
</head>
<body>
  <div id="app">
    <div id="game">
      <canvas id="c"></canvas>
      <div id="hud" class="bar">
        <button id="bMenu">Baner</button>
        <span class="stat" id="sWave"></span>
        <span class="stat" id="sCastle"></span>
        <span class="stat" id="sGold"></span>
        <span class="stat" id="sHero"></span>
        <button id="bWeapon" hidden>Sværd</button>
        <button id="bBuild">Byg</button>
        <button id="bSpeed">Tempo x1</button>
        <button id="bStart">Start bølge</button>
      </div>
      <div id="nextWave" hidden></div>
      <div id="msg" hidden></div>
      <div id="tools" class="bar" inert></div>
      <div id="overlay" hidden>
        <div id="overlayText"></div>
        <div class="row"><button id="bRestart">Spil igen</button><button id="bToMenu">Til banerne</button></div>
      </div>
    </div>
    <div id="menu">
      <div id="menuBg"></div>
      <div id="menuFg">
        <section class="screen" id="scrStart"><div class="big">START</div></section>
        <section class="screen" id="scrLevels">
          <div class="half top"><h2>Baner</h2><div id="levels"></div></div>
          <div class="half bottom"><h2>Opgraderinger <small id="starCount"></small></h2><div id="shop"></div></div>
          <div id="levelDialog" hidden>
            <div class="box"><div id="dlgText"></div><div class="row"><button id="bContinue">Fortsæt</button><button id="bNew">Nyt spil</button><button id="bCancel">Annullér</button></div></div>
          </div>
        </section>
      </div>
      <div id="menuMsg" hidden></div>
    </div>
  </div>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>

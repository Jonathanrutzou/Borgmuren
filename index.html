<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Borgmuren</title>
<style>
  :root { --bg: #1f2328; --fg: #eee; --btn: #2b3036; --bar: rgba(31,35,40,0.82); --border: #555; --accent: #4ade80; --warn: #fbbf24; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; overflow: hidden; }
  /* På højkant drejes spillet, så det altid vises i landskab (størrelsen sættes i resize()). */
  html.portrait #app { inset: auto; top: 0; left: 0; transform-origin: top left; transform: rotate(90deg) translateY(-100%); }
  html.portrait .bar { padding-left: max(16px, env(safe-area-inset-top, 0px)); padding-right: max(16px, env(safe-area-inset-bottom, 0px)); }
  html.portrait #hud { padding-top: 6px; }
  html.portrait #tools { padding-bottom: 8px; }
  html.portrait #msg { top: 56px; }
  canvas { display: block; position: absolute; inset: 0; }
  .bar { position: absolute; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: center;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         background: var(--bar); }
  #hud { top: 0; padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: 6px; }
  #tools { bottom: 0; gap: 6px; padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  #hud .stat { font-size: 15px; font-variant-numeric: tabular-nums; }
  button { font-size: 14px; padding: 7px 11px; border-radius: 6px; border: 2px solid var(--border); background: var(--btn); color: var(--fg); cursor: pointer; }
  button small { opacity: 0.7; }
  button.active { border-color: var(--accent); background: #234; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #bStart { border-color: var(--accent); }
  .info { font-size: 14px; font-weight: bold; }
  #msg { position: absolute; top: calc(56px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
         max-width: calc(100% - 32px); font-size: 14px; color: var(--warn); background: var(--bar); padding: 4px 10px; border-radius: 6px; text-align: center; pointer-events: none; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); font-size: 28px; gap: 16px; text-align: center; padding: 16px; }
  #overlay button { font-size: 20px; padding: 10px 20px; }
  #overlay .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* Menuer: start, baneoversigt og spillet ligger under hinanden og rulles med parallakse. */
  #menu, #game { position: absolute; inset: 0; transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1); }
  #game { background: var(--bg); }
  #menu { overflow: hidden; background: #8ec5e8; }
  #menuBg, #menuFg { position: absolute; left: 0; right: 0; top: 0; height: 200%; transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1); }
  #menuBg { background: linear-gradient(#8ec5e8 0%, #c7e3f2 30%, #e9dfc4 55%, #9fc37a 75%, #6f9a4f 100%); }
  .blob { position: absolute; border-radius: 50%; }
  #menuFg .screen { position: relative; height: 50%; display: flex; flex-direction: column; color: #1c1917; }
  #scrStart { align-items: center; justify-content: center; cursor: pointer; }
  #scrStart .big { font-size: 64px; font-weight: 800; letter-spacing: 6px; padding: 18px 48px; border: 5px solid #1c1917; border-radius: 16px; background: rgba(255,255,255,0.75); }
  #scrStart .hint { margin-top: 16px; font-size: 16px; opacity: 0.7; }
  .half { flex: 1 1 50%; min-height: 0; display: flex; flex-direction: column; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 8px; }
  .half.top { background: rgba(255,255,255,0.35); }
  .half.bottom { background: rgba(255,255,255,0.6); }
  .half h2 { margin: 0 0 8px; font-size: 18px; display: flex; gap: 12px; align-items: baseline; }
  .half h2 small { font-size: 14px; font-weight: normal; }
  #levels { flex: 1; display: flex; overflow: hidden; align-items: center; touch-action: none; cursor: grab; }
  .lvl { flex: 0 0 20%; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .lvl .num { width: min(60%, 96px); aspect-ratio: 1; border-radius: 50%; border: 4px solid #1c1917; display: flex; align-items: center; justify-content: center;
              font-size: 26px; font-weight: 800; background: #fff; }
  .lvl .stars { font-size: 22px; letter-spacing: 2px; }
  .lvl .stars .on { color: #1c1917; }
  .lvl .stars .off { color: #a8a29e; }
  .lvl.locked .num { border-color: #a8a29e; color: #a8a29e; background: rgba(255,255,255,0.4); }
  .lvl.locked { opacity: 0.55; }
  .lvl.playing .num { outline: 4px solid #dc2626; outline-offset: 3px; }
  #shop { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); grid-auto-rows: min-content; gap: 8px; align-content: start; overflow: hidden; }
  #shop button { background: #fff; color: #1c1917; border-color: #1c1917; text-align: left; padding: 10px; }
  #shop button small { display: block; }
  #levelDialog { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); }
  #levelDialog .box { background: #fff; color: #1c1917; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; font-size: 20px; }
  #levelDialog .box .row { display: flex; gap: 12px; }
  #levelDialog button { font-size: 18px; background: #fff; color: #1c1917; border-color: #1c1917; }
  #menuMsg { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #1c1917; color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 14px; pointer-events: none; }
</style>
</head>
<body>
  <div id="app">
    <div id="game">
      <canvas id="c"></canvas>
      <div id="hud" class="bar">
        <button id="bMenu">Baner</button>
        <span class="stat" id="sWave"></span>
        <span class="stat" id="sCastle"></span>
        <span class="stat" id="sGold"></span>
        <span class="stat" id="sHero"></span>
        <button id="bBuild">Byg</button>
        <button id="bSpeed">Tempo x1</button>
        <button id="bStart">Start bølge</button>
      </div>
      <div id="msg" hidden></div>
      <div id="tools" class="bar" hidden></div>
      <div id="overlay" hidden>
        <div id="overlayText"></div>
        <div class="row"><button id="bRestart">Spil igen</button><button id="bToMenu">Til banerne</button></div>
      </div>
    </div>
    <div id="menu">
      <div id="menuBg"></div>
      <div id="menuFg">
        <section class="screen" id="scrStart"><div class="big">START</div><div class="hint">Tryk for at begynde</div></section>
        <section class="screen" id="scrLevels">
          <div class="half top"><h2>Baner <small>Træk sidelæns for at se flere</small></h2><div id="levels"></div></div>
          <div class="half bottom"><h2>Opgraderinger <small id="starCount"></small></h2><div id="shop"></div></div>
          <div id="levelDialog" hidden>
            <div class="box"><div id="dlgText"></div><div class="row"><button id="bContinue">Fortsæt</button><button id="bNew">Nyt spil</button><button id="bCancel">Annullér</button></div></div>
          </div>
        </section>
      </div>
      <div id="menuMsg" hidden></div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
